<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poin piket Siswa - 10 MPLB</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px 20px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    body.spotlight-active .card {
      filter: blur(6px);
      opacity: 0.45;
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .class-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      cursor: pointer;
      user-select: none;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .admin-bar {
      display: none;
      background-color: #0f172a;
      border: 1px dashed #475569;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .admin-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .admin-badge {
      background-color: #22c55e20;
      color: #4ade80;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
    }

    .btn-logout {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
    }

    .add-form {
      display: flex;
      gap: 8px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #f8fafc;
      font-size: 14px;
    }

    .btn-add {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .student-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .student-item {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .student-item:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .rank {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: #1e293b;
      color: #38bdf8;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .student-text {
      min-width: 0;
      flex: 1;
    }

    .student-name {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .student-note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
      line-height: 1.35;
      word-break: break-word;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .point-badge {
      background-color: #1e293b;
      border: 1px solid #38bdf866;
      color: #38bdf8;
      font-weight: 900;
      font-size: 21px;
      padding: 8px 14px;
      border-radius: 10px;
      min-width: 64px;
      text-align: center;
    }

    .admin-controls {
      display: none;
      align-items: center;
      gap: 5px;
    }

    body.is-admin .admin-controls {
      display: flex;
    }

    body.is-admin .admin-bar {
      display: block;
    }

    .ctrl-btn {
      border: none;
      border-radius: 6px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: white;
    }

    .btn-min { background-color: #ef4444; }
    .btn-plus { background-color: #22c55e; }
    .btn-del { background-color: #475569; }

    /* Modal Spotlight di Tengah Layar */
    .spotlight-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .spotlight-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .spotlight-card {
      background-color: #1e293b;
      border: 1px solid #38bdf888;
      border-radius: 20px;
      padding: 26px 22px;
      width: 100%;
      max-width: 410px;
      max-height: 85vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      transform: scale(0.82) translateY(18px);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .spotlight-backdrop.show .spotlight-card {
      transform: scale(1) translateY(0);
    }

    .spotlight-rank {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
    }

    .spotlight-name {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .spotlight-point-box {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .spotlight-point-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .spotlight-point-value {
      font-size: 42px;
      font-weight: 900;
      color: #38bdf8;
      margin-top: 2px;
    }

    .history-box {
      text-align: left;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .history-title {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .history-item {
      font-size: 12px;
      color: #e2e8f0;
      background-color: #1e293b99;
      border-left: 3px solid #38bdf8;
      padding: 7px 9px;
      border-radius: 6px;
      line-height: 1.35;
    }

    .history-item.minus {
      border-left-color: #ef4444;
    }

    .history-item.plus {
      border-left-color: #22c55e;
    }

    .history-time {
      display: block;
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .btn-close-spotlight {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1 class="class-name" id="classTitle">10 MPLB</h1>
      <p class="subtitle">SMK Pariwisata Citayam • Poin Siswa</p>
    </div>

    <div class="admin-bar">
      <div class="admin-top">
        <span class="admin-badge">Mode Admin Aktif</span>
        <button class="btn-logout" id="logoutBtn">Kunci Kembali</button>
      </div>
      <div class="add-form">
        <input type="text" id="newNameInput" placeholder="Ketik nama siswa baru...">
        <button class="btn-add" id="addStudentBtn">+ Tambah</button>
      </div>
    </div>

    <div class="student-list" id="studentList"></div>
  </div>

  <!-- Modal Spotlight + Riwayat -->
  <div class="spotlight-backdrop" id="spotlightBackdrop">
    <div class="spotlight-card" id="spotlightCard">
      <div class="spotlight-rank" id="spotlightRank">No. 1 • 10 MPLB</div>
      <div class="spotlight-name" id="spotlightName">Nama Siswa</div>
      <div class="spotlight-point-box">
        <div class="spotlight-point-label">Poin Saat Ini</div>
        <div class="spotlight-point-value" id="spotlightPoint">100</div>
      </div>

      <div class="history-box">
        <div class="history-title">Riwayat Perubahan Poin</div>
        <ul class="history-list" id="spotlightHistory"></ul>
      </div>

      <button class="btn-close-spotlight" id="closeSpotlightBtn">Tutup</button>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "sekbid10mpLb";
    const STORAGE_KEY = "daftar_poin_10_mplb_riwayat_v1";

    const namaSiswaList = [
      "Aisyah", "Aleya", "Aliya", "Alysha", "Anaya", "Andriani", "Arif",
      "Azmazia", "Azura", "Elvina", "Farah", "Fellya", "Hanna", "Helwa",
      "Indah", "Jessica", "Junifar", "Kayla", "Labib", "Maulida", "Meysi",
      "Puri", "Riski", "Risma", "Sabna", "Salsa", "Silvi", "Syafira",
      "Waizah", "Zahra"
    ];

    function buatDefaultSiswa() {
      return namaSiswaList.map((nama) => ({
        nama,
        poin: 100,
        riwayat: [
          {
            tipe: "netral",
            teks: "Poin awal 100",
            waktu: "Awal semester"
          }
        ]
      }));
    }

    let dataSiswa = buatDefaultSiswa();
    let tapCount = 0;
    let tapTimer;

    function formatWaktu() {
      const now = new Date();
      const tgl = now.toLocaleDateString("id-ID", { day: "2-digit", month: "short" });
      const jam = now.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
      return `${tgl}, ${jam}`;
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            dataSiswa = parsed.map((item) => ({
              nama: item.nama,
              poin: typeof item.poin === "number" ? item.poin : 100,
              riwayat: Array.isArray(item.riwayat) && item.riwayat.length > 0
                ? item.riwayat
                : [{ tipe: "netral", teks: "Poin awal 100", waktu: "Awal semester" }]
            }));
          }
        }
      } catch (e) {
        dataSiswa = buatDefaultSiswa();
      }
      renderList();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataSiswa));
      } catch (e) {}
      renderList();
    }

    function bukaSpotlight(siswa, nomorUrut) {
      document.getElementById("spotlightRank").textContent = `No. ${nomorUrut} • 10 MPLB`;
      document.getElementById("spotlightName").textContent = siswa.nama;
      document.getElementById("spotlightPoint").textContent = String(siswa.poin);

      const listEl = document.getElementById("spotlightHistory");
      listEl.innerHTML = "";

      siswa.riwayat.forEach((entry) => {
        const li = document.createElement("li");
        li.className = `history-item ${entry.tipe || "netral"}`;

        const teksSpan = document.createElement("span");
        teksSpan.textContent = entry.teks;

        const waktuSpan = document.createElement("span");
        waktuSpan.className = "history-time";
        waktuSpan.textContent = entry.waktu || "";

        li.appendChild(teksSpan);
        li.appendChild(waktuSpan);
        listEl.appendChild(li);
      });

      document.body.classList.add("spotlight-active");
      const backdrop = document.getElementById("spotlightBackdrop");
      backdrop.style.display = "flex";
      requestAnimationFrame(() => {
        backdrop.classList.add("show");
      });
    }

    function tutupSpotlight() {
      const backdrop = document.getElementById("spotlightBackdrop");
      backdrop.classList.remove("show");
      document.body.classList.remove("spotlight-active");
      setTimeout(() => {
        if (!backdrop.classList.contains("show")) {
          backdrop.style.display = "none";
        }
      }, 260);
    }

    function renderList() {
      const container = document.getElementById("studentList");
      container.innerHTML = "";

      dataSiswa.sort((a, b) => a.nama.localeCompare(b.nama, "id"));

      dataSiswa.forEach((siswa, index) => {
        const item = document.createElement("div");
        item.className = "student-item";
        item.addEventListener("click", () => bukaSpotlight(siswa, index + 1));

        const info = document.createElement("div");
        info.className = "student-info";

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = String(index + 1);

        const textWrap = document.createElement("div");
        textWrap.className = "student-text";

        const name = document.createElement("div");
        name.className = "student-name";
        name.textContent = siswa.nama;

        const latest = siswa.riwayat && siswa.riwayat[0] ? siswa.riwayat[0] : null;
        const note = document.createElement("div");
        note.className = "student-note";
        note.textContent = latest ? `Riwayat: ${latest.teks}` : "";

        textWrap.appendChild(name);
        textWrap.appendChild(note);

        info.appendChild(rank);
        info.appendChild(textWrap);

        const right = document.createElement("div");
        right.className = "right-side";

        const badge = document.createElement("div");
        badge.className = "point-badge";
        badge.textContent = String(siswa.poin);

        const controls = document.createElement("div");
        controls.className = "admin-controls";

        const btnMin = document.createElement("button");
        btnMin.className = "ctrl-btn btn-min";
        btnMin.textContent = "-1";
        btnMin.addEventListener("click", (e) => {
          e.stopPropagation();
          ubahPoin(index, -1);
        });

        const btnPlus = document.createElement("button");
        btnPlus.className = "ctrl-btn btn-plus";
        btnPlus.textContent = "+1";
        btnPlus.addEventListener("click", (e) => {
          e.stopPropagation();
          ubahPoin(index, 1);
        });

        const btnDel = document.createElement("button");
        btnDel.className = "ctrl-btn btn-del";
        btnDel.textContent = "×";
        btnDel.title = "Hapus";
        btnDel.addEventListener("click", (e) => {
          e.stopPropagation();
          hapusSiswa(index);
        });

        controls.appendChild(btnMin);
        controls.appendChild(btnPlus);
        controls.appendChild(btnDel);

        right.appendChild(badge);
        right.appendChild(controls);

        item.appendChild(info);
        item.appendChild(right);
        container.appendChild(item);
      });
    }

    function ubahPoin(index, delta) {
      const aksi = delta > 0 ? "menambah (+1)" : "mengurangi (-1)";
      const alasan = prompt(`Info/alasan ${aksi} poin untuk ${dataSiswa[index].nama}:`);
      if (alasan === null) return;

      dataSiswa[index].poin += delta;
      const teksAlasan = alasan.trim() !== ""
        ? alasan.trim()
        : (delta > 0 ? "Poin ditambah oleh admin" : "Poin dikurangi oleh admin");

      dataSiswa[index].riwayat.unshift({
        tipe: delta > 0 ? "plus" : "minus",
        teks: `${delta > 0 ? "+1" : "-1"} — ${teksAlasan}`,
        waktu: formatWaktu()
      });

      saveData();
    }

    function tambahSiswa() {
      const input = document.getElementById("newNameInput");
      const namaBaru = input.value.trim();
      if (namaBaru !== "") {
        dataSiswa.push({
          nama: namaBaru,
          poin: 100,
          riwayat: [{ tipe: "netral", teks: "Siswa baru (poin awal 100)", waktu: formatWaktu() }]
        });
        input.value = "";
        saveData();
      }
    }

    function hapusSiswa(index) {
      if (confirm(`Hapus ${dataSiswa[index].nama} dari daftar?`)) {
        dataSiswa.splice(index, 1);
        saveData();
      }
    }

    document.getElementById("closeSpotlightBtn").addEventListener("click", tutupSpotlight);
    document.getElementById("spotlightBackdrop").addEventListener("click", (e) => {
      if (e.target.id === "spotlightBackdrop") tutupSpotlight();
    });

    document.getElementById("addStudentBtn").addEventListener("click", tambahSiswa);
    document.getElementById("logoutBtn").addEventListener("click", () => {
      document.body.classList.remove("is-admin");
    });

    document.getElementById("classTitle").addEventListener("click", () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1000);

      if (tapCount === 3) {
        tapCount = 0;
        const pass = prompt("Masukkan Password Admin:");
        if (pass === ADMIN_PASSWORD) {
          document.body.classList.add("is-admin");
        } else if (pass !== null) {
          alert("Password salah!");
        }
      }
    });

    loadData();
  </script>
</body>
</html>
